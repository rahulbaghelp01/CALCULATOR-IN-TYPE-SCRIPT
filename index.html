<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main id="content">
        <h2 id="heading">Calculator In typescript</h2>

        <div id="Calculator">
            <input id="input" />
            <div id="button-container">
                <button class="calc-btn" id="clear-all" style="background-color: #0077ff;">AC</button>

                <button class="calc-btn" id="percent" style="background-color: #ff69b4;">%</button>
                <button class="calc-btn" id="divide" style="background-color: #ffd700;">÷</button>

                <button class="calc-btn" id="seven" style="background-color: #7cfc00;">7</button>
                <button class="calc-btn" id="eight" style="background-color: #ff7f50;">8</button>
                <button class="calc-btn" id="nine" style="background-color: #ba55d3;">9</button>
                <button class="calc-btn" id="multiply" style="background-color: #00ced1;">×</button>

                <button class="calc-btn" id="four" style="background-color: #ff6347;">4</button>
                <button class="calc-btn" id="five" style="background-color: #40e0d0;">5</button>
                <button class="calc-btn" id="six" style="background-color: #ffb6c1;">6</button>
                <button class="calc-btn" id="subtract" style="background-color: #9370db;">−</button>

                <button class="calc-btn" id="one" style="background-color: #32cd32;">1</button>
                <button class="calc-btn" id="two" style="background-color: #ff8c00;">2</button>
                <button class="calc-btn" id="three" style="background-color: #00bfff;">3</button>
                <button class="calc-btn" id="add" style="background-color: #ff1493;">+</button>

                <button class="calc-btn" id="zero" style="background-color: #adff2f;">0</button>
                <button class="calc-btn" id="decimal" style="background-color: #ee82ee;">.</button>
                <button class="calc-btn" id="sign" style="background-color: #20b2aa;">±</button>
                <button class="calc-btn" id="equals" style="background-color: #ff4500;">=</button>
                <button class="calc-btn" id="clear" style="background-color: #1e90ff;">C</button>
            </div>
        </div>

    </main>
    <script type="module" src="./dist/index.js"></script>
</body>

</html>
